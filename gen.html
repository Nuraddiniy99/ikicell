<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Generate Icons</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        canvas { border: 1px solid #ddd; margin: 10px; }
        .container { display: flex; flex-wrap: wrap; gap: 10px; }
        button { padding: 10px 20px; background: #006994; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>IKI Cell Icon Generator</h1>
    <p>Paste URL gambar atau upload file:</p>
    <input type="text" id="imgUrl" placeholder="https://i.ibb.co/..." style="width:100%;padding:10px;margin:10px 0">
    <input type="file" id="imgFile" accept="image/*">
    <button onclick="generateIcons()">Generate Icons</button>
    <div class="container" id="icons"></div>
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        async function generateIcons() {
            const container = document.getElementById('icons');
            container.innerHTML = '';
            
            let imgSrc = document.getElementById('imgUrl').value;
            const file = document.getElementById('imgFile').files[0];
            
            if (file) {
                imgSrc = URL.createObjectURL(file);
            }
            
            if (!imgSrc) {
                alert('Masukkan URL gambar atau upload file');
                return;
            }
            
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = imgSrc;
            
            img.onload = function() {
                sizes.forEach(size => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    
                    // Draw rounded background
                    ctx.fillStyle = '#006994';
                    ctx.beginPath();
                    ctx.roundRect(0, 0, size, size, size * 0.2);
                    ctx.fill();
                    
                    // Draw image with padding
                    const padding = size * 0.08;
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(padding, padding, size - padding*2, size - padding*2, size * 0.15);
                    ctx.clip();
                    ctx.drawImage(img, padding, padding, size - padding*2, size - padding*2);
                    ctx.restore();
                    
                    // Download link
                    const link = document.createElement('a');
                    link.download = `icon-${size}x${size}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.textContent = `${size}x${size}`;
                    
                    const wrapper = document.createElement('div');
                    wrapper.style.textAlign = 'center';
                    wrapper.appendChild(canvas);
                    wrapper.appendChild(document.createElement('br'));
                    wrapper.appendChild(link);
                    container.appendChild(wrapper);
                });
                
                // Generate maskable icon
                const maskCanvas = document.createElement('canvas');
                maskCanvas.width = 512;
                maskCanvas.height = 512;
                const maskCtx = maskCanvas.getContext('2d');
                
                // Safe zone for maskable icon (80% of size)
                const safeSize = 512 * 0.8;
                const safePadding = (512 - safeSize) / 2;
                
                maskCtx.fillStyle = '#006994';
                maskCtx.fillRect(0, 0, 512, 512);
                
                maskCtx.save();
                maskCtx.beginPath();
                maskCtx.roundRect(safePadding, safePadding, safeSize, safeSize, 40);
                maskCtx.clip();
                maskCtx.drawImage(img, safePadding, safePadding, safeSize, safeSize);
                maskCtx.restore();
                
                const maskLink = document.createElement('a');
                maskLink.download = 'maskable-icon-512x512.png';
                maskLink.href = maskCanvas.toDataURL('image/png');
                maskLink.textContent = 'Maskable 512x512';
                
                const maskWrapper = document.createElement('div');
                maskWrapper.style.textAlign = 'center';
                maskWrapper.appendChild(maskCanvas);
                maskWrapper.appendChild(document.createElement('br'));
                maskWrapper.appendChild(maskLink);
                container.appendChild(maskWrapper);
            };
        }
    </script>
</body>
</html>
