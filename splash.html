<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1628">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tambahkan ke <head> splash.html -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>IKI Cell</title>
    <style>
        :root {
            --bg: #0a0f1e;
            --accent: #3b82f6;
            --accent2: #8b5cf6;
            --gold: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            animation: fadeInScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            animation: float 3s ease-in-out infinite;
        }

        .logo-hexagon {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(59,130,246,0.4), 0 0 120px rgba(139,92,246,0.2);
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .logo-hexagon svg {
            width: 44px;
            height: 44px;
            color: white;
            animation: spinOnce 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-ring {
            position: absolute;
            inset: -12px;
            border: 2px solid rgba(59,130,246,0.3);
            border-radius: 50%;
            animation: ringPulse 2s ease-in-out infinite;
        }

        .logo-ring:nth-child(3) {
            inset: -24px;
            animation-delay: 0.3s;
            border-color: rgba(139,92,246,0.2);
        }

        .logo-ring:nth-child(4) {
            inset: -36px;
            animation-delay: 0.6s;
            border-color: rgba(245,158,11,0.15);
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2s ease-in-out infinite;
            background-size: 200% 200%;
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeIn 1s ease 0.5s both;
        }

        .progress-bar {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--gold));
            border-radius: 2px;
            animation: progress 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            width: 0%;
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--accent);
            border-radius: 50%;
            animation: particleFloat 4s ease-in-out infinite;
            opacity: 0;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 0.5s; background: var(--accent2); }
        .particle:nth-child(3) { left: 30%; animation-delay: 1s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1.5s; background: var(--gold); }
        .particle:nth-child(5) { left: 50%; animation-delay: 2s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 0.3s; background: var(--accent2); }
        .particle:nth-child(7) { left: 70%; animation-delay: 0.8s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 1.3s; background: var(--gold); }
        .particle:nth-child(9) { left: 90%; animation-delay: 1.8s; }
        .particle:nth-child(10) { left: 15%; animation-delay: 2.2s; background: var(--accent2); }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 60px rgba(59,130,246,0.4), 0 0 120px rgba(139,92,246,0.2); }
            50% { box-shadow: 0 0 80px rgba(59,130,246,0.6), 0 0 160px rgba(139,92,246,0.35); }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        @keyframes spinOnce {
            from { transform: rotate(0deg) scale(0.5); opacity: 0; }
            to { transform: rotate(360deg) scale(1); opacity: 1; }
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; }
            50% { transform: translateY(50vh) scale(1); opacity: 0.8; }
            80% { opacity: 0; }
            100% { transform: translateY(-20px) scale(0); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="splash-container">
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-hexagon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
                    <line x1="12" y1="22" x2="12" y2="15.5"/>
                    <polyline points="22 8.5 12 15.5 2 8.5"/>
                </svg>
            </div>
        </div>
        <div class="brand-name">IKI Cell</div>
        <div class="brand-subtitle">Digital Services</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        setTimeout(function() {
            document.querySelector('.splash-container').style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            document.querySelector('.splash-container').style.opacity = '0';
            document.querySelector('.splash-container').style.transform = 'scale(1.05)';
            
            setTimeout(function() {
                window.location.replace('/iki-cell/index.html');
            }, 400);
        }, 2200);
    </script>
</body>
</html>
